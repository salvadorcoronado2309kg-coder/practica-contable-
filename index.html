<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: app de una columna para teléfono — encabezado fijo arriba, navegación inferior, tarjetas tipo libro contable */
:root{
  --bg:#eef3f1; --surface:#ffffff; --sunk:#e3ebe8; --ink:#15211e; --muted:#5a6c66; --line:#d3dfdb;
  --accent:#0d6b5a; --accent-ink:#ffffff; --accent-soft:#d8eee7;
  --debe:#1d5ea6; --haber:#a3461c; --ok:#1d7a3e; --ok-soft:#ddf2e3; --bad:#b3261e; --bad-soft:#fbe3e0; --warn:#8a5d00;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1412; --surface:#151f1c; --sunk:#1b2723; --ink:#e3ece9; --muted:#93a8a1; --line:#2a3a35;
  --accent:#4fc2a6; --accent-ink:#06201a; --accent-soft:#173a32;
  --debe:#86b4f2; --haber:#f1a47f; --ok:#63cf8a; --ok-soft:#173826; --bad:#ff8f84; --bad-soft:#3d1c19; --warn:#e7b84a;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1412; --surface:#151f1c; --sunk:#1b2723; --ink:#e3ece9; --muted:#93a8a1; --line:#2a3a35;
  --accent:#4fc2a6; --accent-ink:#06201a; --accent-soft:#173a32;
  --debe:#86b4f2; --haber:#f1a47f; --ok:#63cf8a; --ok-soft:#173826; --bad:#ff8f84; --bad-soft:#3d1c19; --warn:#e7b84a;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--accent-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 12px}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;margin:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.75rem;opacity:.85;letter-spacing:.02em}
.top-chip{font-size:.75rem;font-weight:600;padding:4px 9px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 18%,transparent);white-space:nowrap}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h2.view-title{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:-.015em;margin:4px 0 0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:62ch}
h3{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin:0}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 13px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{min-height:32px;padding:5px 10px;font-size:.85rem}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;min-height:42px;font-size:16px}
textarea{resize:vertical;min-height:60px}

/* Editor de asientos */
.ed-meta{display:grid;grid-template-columns:150px 1fr;gap:10px}
@media (max-width:480px){.ed-meta{grid-template-columns:1fr}}
.ed-line{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;padding:10px;border-radius:8px;background:var(--sunk)}
.ed-line select{grid-column:1/-1;background:var(--surface)}
.ed-line input{background:var(--surface);text-align:right;font-family:var(--f-num)}
.ed-line .lab-d{color:var(--debe)} .ed-line .lab-h{color:var(--haber)}
.x{border:none;background:transparent;color:var(--muted);font-size:1.3rem;width:40px;cursor:pointer;align-self:end;min-height:42px;border-radius:8px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:2px solid var(--ink);padding-top:8px}
.totals div{display:flex;flex-direction:column;gap:2px;min-width:0}
.totals b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.95rem;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--sunk);color:var(--muted)}
.msg{font-size:.88rem;border-radius:8px;padding:9px 11px}
.msg:empty{display:none}
.msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.ok{background:var(--ok-soft);color:var(--ok)}

/* Libro diario */
.jrn-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.jrn-n{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.jrn-date{font-family:var(--f-num);font-size:.82rem;color:var(--muted)}
.jrn-t{width:100%;border-collapse:collapse;font-size:.88rem}
.jrn-t th{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;font-weight:700;padding:4px 0;border-bottom:1px solid var(--line)}
.jrn-t th:first-child{text-align:left}
.jrn-t td{padding:5px 0;vertical-align:top;border-bottom:1px dashed var(--line)}
.jrn-t td.amt{text-align:right;white-space:nowrap;padding-left:8px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.jrn-t td.d{color:var(--debe)} .jrn-t td.h{color:var(--haber)}
.jrn-t tr.cr td:first-child{padding-left:22px}
.code{font-family:var(--f-num);font-size:.78rem;color:var(--muted);margin-right:6px}
.concepto{font-size:.88rem;color:var(--muted);font-style:italic;margin:0}
.tag-ej{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:1px 5px}

/* Mayor: cuentas T */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media (max-width:420px){.tgrid{grid-template-columns:1fr}}
.tacc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;min-width:0}
.tacc h4{margin:0 0 8px;font-size:.92rem;font-weight:700;text-align:center;text-wrap:balance}
.tbody{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink)}
.tside{padding:6px 8px;min-width:0}
.tside+.tside{border-left:2px solid var(--ink)}
.tside .lbl{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;margin-bottom:4px}
.tside.d .lbl{color:var(--debe)} .tside.h .lbl{color:var(--haber)}
.tmov{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.8rem;padding:1px 0}
.tmov span:first-child{color:var(--muted)}
.ttot{border-top:1px solid var(--line);margin-top:4px;padding-top:3px;font-weight:600}
.tsaldo{margin-top:6px;text-align:center;font-size:.82rem;font-weight:600}
.tsaldo .num{font-weight:600}

/* Tablas */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
table.grid{width:100%;border-collapse:collapse;font-size:.84rem;min-width:620px}
table.grid th{font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:2px solid var(--ink);font-weight:700}
table.grid th:nth-child(-n+2){text-align:left}
table.grid td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
table.grid td:nth-child(2){text-align:left;font-family:var(--f-body);white-space:normal}
table.grid td:first-child{text-align:left;color:var(--muted)}
table.grid tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:3px double var(--ink)}

/* Estados financieros */
.stmt{display:flex;flex-direction:column}
.stmt-h{text-align:center;display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.stmt-h strong{font-family:var(--f-display);font-size:1.1rem}
.stmt-h span{font-size:.82rem;color:var(--muted)}
.sl{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:4px 0;font-size:.88rem;align-items:baseline}
.sl .a1,.sl .a2{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;min-width:92px;white-space:nowrap}
.sl.sec{font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding-top:12px}
.sl.ind span:first-child{padding-left:14px}
.sl.sub{font-weight:700}
.sl.sub .a2{border-top:1px solid var(--ink)}
.sl.big{font-weight:800;font-size:.95rem;padding-top:8px}
.sl.big .a2{border-top:1px solid var(--ink);border-bottom:3px double var(--ink)}
@media (max-width:400px){.sl{font-size:.8rem;gap:6px}.sl .a1,.sl .a2{min-width:78px}}

.seg{display:flex;background:var(--sunk);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:transparent;border-radius:7px;padding:8px 6px;font-weight:600;font-size:.86rem;cursor:pointer;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Catálogo */
.cat-cls{font-family:var(--f-display);font-weight:800;font-size:1rem;margin:6px 0 0;color:var(--accent)}
.cat-grp{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.cat-item{display:grid;grid-template-columns:76px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem;align-items:baseline}
.cat-item .num{color:var(--muted);font-size:.8rem}
.nat{font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:4px}
.nat.D{color:var(--debe);background:color-mix(in srgb,var(--debe) 12%,transparent)}
.nat.C{color:var(--haber);background:color-mix(in srgb,var(--haber) 12%,transparent)}

/* Práctica */
.ex{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;text-align:left;width:100%}
.ex:last-child{border-bottom:none}
.ex-n{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.82rem;background:var(--sunk);color:var(--muted);font-family:var(--f-num)}
.ex.done .ex-n{background:var(--ok);color:var(--surface)}
.ex p{margin:0;font-size:.9rem}
.ex-active{border:2px solid var(--accent)}
.task{font-size:1rem;margin:0;line-height:1.5}

.empty{text-align:center;color:var(--muted);padding:24px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:var(--r);padding:10px 12px;font-size:.88rem}

/* Navegación inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:none;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.card,.tacc{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head>

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const NF=new Intl.NumberFormat('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round((+n||0)*100)/100;
const fm=n=>NF.format(r2(n));
const fp=n=>{n=r2(n);return n<0?'('+NF.format(-n)+')':NF.format(n)};
const zero=n=>Math.abs(n)<0.005;
const pnum=v=>{v=String(v||'').replace(/[,\s]/g,'').replace(/^RD\$/i,'');const n=parseFloat(v);return isFinite(n)?r2(n):0};
const fdate=s=>s?s.split('-').reverse().join('/'):'';
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const accName=c=>AMAP[c]?AMAP[c].name:'(cuenta no encontrada)';
function sortEntries(){S.entries.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''))}

function ledger(){const L={};S.entries.forEach((e,i)=>{e.lineas.forEach(l=>{const x=L[l.c]??={d:0,h:0,mov:[]};x.d=r2(x.d+(+l.d||0));x.h=r2(x.h+(+l.h||0));x.mov.push({n:i+1,d:+l.d||0,h:+l.h||0})})});return L}
const dh=(L,c)=>L[c]?r2(L[c].d-L[c].h):0;

/* ========== EDITOR DE ASIENTOS ========== */
class Editor{
 constructor(root,o){this.root=root;this.o=o;this.k=o.key;
  this.lines=(o.lines&&o.lines.length?o.lines:[{c:''},{c:''}]).map(l=>({c:l.c||'',d:+l.d?String(l.d):'',h:+l.h?String(l.h):''}));
  this.fecha=o.fecha||today();this.concepto=o.concepto||'';this.render();this.bind();}
 render(){const k=this.k;
  this.root.innerHTML=`${this.o.meta===false?'':`<div class="ed-meta">
   <label class="f" for="${k}-fecha">Fecha<input type="date" id="${k}-fecha" value="${esc(this.fecha)}"></label>
   <label class="f" for="${k}-conc">Concepto<input type="text" id="${k}-conc" placeholder="Ej.: Para registrar la compra de…" value="${esc(this.concepto)}"></label></div>`}
   <div class="row" style="gap:6px;flex-direction:column;align-items:stretch">${this.lines.map((l,i)=>`
    <div class="ed-line" data-i="${i}">
     <select id="${k}-c${i}" aria-label="Cuenta de la línea ${i+1}" data-f="c">${OPTS}</select>
     <label class="f lab-d" for="${k}-d${i}">Debe<input type="text" inputmode="decimal" id="${k}-d${i}" data-f="d" value="${esc(l.d)}" placeholder="0.00"></label>
     <label class="f lab-h" for="${k}-h${i}">Haber<input type="text" inputmode="decimal" id="${k}-h${i}" data-f="h" value="${esc(l.h)}" placeholder="0.00"></label>
     <button class="x" data-act="del" aria-label="Quitar línea ${i+1}" ${this.lines.length<=2?'disabled':''}>×</button>
    </div>`).join('')}</div>
   <div class="row"><button class="btn sm ghost" data-act="add">+ Agregar línea</button></div>
   <div class="totals" id="${k}-tot"></div>
   <div class="msg" id="${k}-msg"></div>
   <div class="row">${this.o.extraBtns||''}<span class="spacer"></span>${this.o.onCancel?`<button class="btn ghost" data-act="cancel">Cancelar</button>`:''}<button class="btn primary" data-act="ok">${this.o.submitLabel||'Registrar asiento'}</button></div>`;
  this.lines.forEach((l,i)=>{const s=this.root.querySelector(`#${k}-c${i}`);s.value=l.c});
  this.totals();}
 sync(){const k=this.k;const f=this.root.querySelector(`#${k}-fecha`),c=this.root.querySelector(`#${k}-conc`);if(f)this.fecha=f.value;if(c)this.concepto=c.value;}
 totals(){const d=r2(this.lines.reduce((s,l)=>s+pnum(l.d),0)),h=r2(this.lines.reduce((s,l)=>s+pnum(l.h),0)),df=r2(d-h);
  this.root.querySelector(`#${this.k}-tot`).innerHTML=`<div><span class="eyebrow" style="color:var(--debe)">Total debe</span><b>${fm(d)}</b></div>
   <div><span class="eyebrow" style="color:var(--haber)">Total haber</span><b>${fm(h)}</b></div>
   <div><span class="eyebrow">Diferencia</span>${zero(df)&&d>0?'<span class="pill ok">Cuadra ✓</span>':`<b style="color:${zero(df)?'var(--muted)':'var(--bad)'}">${fm(Math.abs(df))}</b>`}</div>`;}
 msg(t,cls){const m=this.root.querySelector(`#${this.k}-msg`);m.className='msg '+(cls||'bad');m.innerHTML=t}
 bind(){
  this.root.addEventListener('input',ev=>{const t=ev.target,box=t.closest('.ed-line');if(!box)return;const i=+box.dataset.i,f=t.dataset.f;
   if(f==='d'||f==='h'){this.lines[i][f]=t.value;const o=f==='d'?'h':'d';if(t.value.trim()&&this.lines[i][o]){this.lines[i][o]='';box.querySelector(`[data-f="${o}"]`).value=''}this.totals();}});
  this.root.addEventListener('change',ev=>{const t=ev.target,box=t.closest('.ed-line');if(box&&t.dataset.f==='c')this.lines[+box.dataset.i].c=t.value});
  this.root.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b||!this.root.contains(b))return;const a=b.dataset.act;
   if(a==='add'){this.sync();this.lines.push({c:'',d:'',h:''});this.render();this.root.querySelector(`#${this.k}-c${this.lines.length-1}`).focus()}
   else if(a==='del'){this.sync();this.lines.splice(+b.closest('.ed-line').dataset.i,1);this.render()}
   else if(a==='cancel'){this.o.onCancel()}
   else if(a==='ok'){this.submit()}
   else if(this.o.onExtra){this.sync();this.o.onExtra(a,this)}});}
 collect(){this.sync();const out=[];for(const [i,l] of this.lines.entries()){const d=pnum(l.d),h=pnum(l.h);
   if(!l.c&&!d&&!h)continue;
   if(!l.c)return {err:`La línea ${i+1} tiene monto pero no tiene cuenta.`};
   if(!d&&!h)return {err:`La línea ${i+1} (${esc(accName(l.c))}) no tiene monto en Debe ni en Haber.`};
   if(d<0||h<0)return {err:'Los montos no pueden ser negativos.'};
   out.push({c:l.c,d,h});}
  if(out.length<2)return {err:'Un asiento necesita al menos dos cuentas: una al Debe y otra al Haber (partida doble).'};
  if(!out.some(l=>l.d)||!out.some(l=>l.h))return {err:'Debe haber al menos una cuenta al Debe y una al Haber.'};
  const td=r2(out.reduce((s,l)=>s+l.d,0)),th=r2(out.reduce((s,l)=>s+l.h,0));
  if(!zero(td-th))return {err:`El asiento no cuadra: Debe ${fm(td)} ≠ Haber ${fm(th)}. Diferencia de RD$${fm(Math.abs(td-th))}.`};
  if(this.o.meta!==false&&!this.concepto.trim())return {err:'Escribe el concepto o explicación del asiento.'};
  return {lines:out};}
 submit(){const r=this.collect();if(r.err){this.msg(r.err);return}this.o.onSubmit(r.lines,this);}
}

function tAccount(c,x){const a=AMAP[c]||{name:'(desconocida)',nat:'D'};const s=r2(x.d-x.h);
 const dm=x.mov.filter(m=>m.d),hm=x.mov.filter(m=>m.h);
 const side=(arr,k)=>arr.map(m=>`<div class="tmov"><span>#${m.n}</span><span>${fm(m[k])}</span></div>`).join('')||'<div class="tmov"><span>—</span><span></span></div>';

 return `<div class="tacc"><h4><span class="code">${c}</span>${esc(a.name)}</h4><div class="tbody">

 let h=`<h2 class="view-title">Libro Mayor</h2><p class="lede">Cada cuenta en forma de T. El número a la izquierda (#) es el asiento del Diario de donde viene el movimiento.</p>`;
 if(!codes.length){V().innerHTML=h+`<div class="card empty"><strong>Sin movimientos.</strong><span>Registra asientos en el Diario para ver las cuentas T.</span></div>`;return}
 h+=`<label class="f" for="mayorSel">Mostrar<select id="mayorSel"><option value="">Todas las cuentas con movimiento (${codes.length})</option>${codes.map(c=>`<option value="${c}">${c} · ${esc(accName(c))}</option>`).join('')}</select></label>`;
 const list=mayorSel&&L[mayorSel]?[mayorSel]:codes;
 h+=`<div class="tgrid">${list.map(c=>tAccount(c,L[c])).join('')}</div>`;
 V().innerHTML=h;const sel=document.getElementById('mayorSel');sel.value=L[mayorSel]?mayorSel:'';sel.onchange=()=>{mayorSel=sel.value;render()};}

/* ----- Cálculos de estados ----- */
function calc(){const L=ledger();const has=c=>L[c]&&(L[c].d||L[c].h);
 const inG=g=>ACC.filter(a=>a.g===g&&has(a.code));
 const periodic=!has('5100');const invIni=dh(L,'1004');
 const compras=['5000','5001','5002','5003'].reduce((s,c)=>s+dh(L,c),0);
 const invFin=periodic?(S.invFinal==null?invIni:S.invFinal):invIni;
 const ventas=inG('ING').reduce((s,a)=>s-dh(L,a.code),0);
 const costo=periodic?r2(invIni+compras-invFin):dh(L,'5100');
 const sumG=g=>inG(g).reduce((s,a)=>s+dh(L,a.code),0);
 const gv=sumG('GV'),ga=sumG('GA'),gf=sumG('GF'),og=sumG('OG'),isr=sumG('ISR'),oi=-sumG('OI');
 const ub=r2(ventas-costo),uo=r2(ub-gv-ga),uai=r2(uo+oi-gf-og),un=r2(uai-isr);
 return {L,has,inG,periodic,invIni,compras,invFin,ventas,costo,gv,ga,gf,og,isr,oi,ub,uo,uai,un}}

const sl=(lab,a1,a2,cls)=>`<div class="sl ${cls||''}"><span>${lab}</span><span class="a1">${a1==null?'':fp(a1)}</span><span class="a2">${a2==null?'':fp(a2)}</span></div>`;
function period(){const f=S.entries.map(e=>e.fecha).filter(Boolean).sort();return f.length?{a:f[0],b:f[f.length-1]}:null}

function estadoResultados(C){const p=period();const {L}=C;
 let h=`<div class="stmt"><div class="stmt-h"><strong>${esc(S.empresa)}</strong><span>Estado de Resultados</span><span>${p?`Del ${fdate(p.a)} al ${fdate(p.b)}`:'Sin período'} · Valores en RD$</span></div>`;
 h+=sl('Ingresos',null,null,'sec');
 C.inG('ING').forEach(a=>h+=sl(esc(a.name),-dh(L,a.code),null,'ind'));
 h+=sl('Ventas netas',null,C.ventas,'sub');
 h+=sl('Costo de ventas',null,null,'sec');
 if(C.periodic){h+=sl('Inventario inicial de mercancías',C.invIni,null,'ind');
  ['5000','5001','5002','5003'].forEach(c=>{if(C.has(c))h+=sl((AMAP[c].contra?'Menos: ':'Más: ')+esc(AMAP[c].name),dh(L,c),null,'ind')});
  h+=sl('Mercancía disponible para la venta',C.invIni+C.compras,null,'ind');
  h+=sl('Menos: Inventario final',-C.invFin,null,'ind');}
 h+=sl('Costo de ventas',null,-C.costo,'sub');
 h+=sl(C.ub<0?'Pérdida bruta':'Utilidad bruta en ventas',null,C.ub,'sub');
 h+=sl('Gastos de operación',null,null,'sec');
 C.inG('GV').forEach(a=>h+=sl(esc(a.name),dh(L,a.code),null,'ind'));if(C.gv)h+=sl('Total gastos de ventas',null,-C.gv,'sub');
 C.inG('GA').forEach(a=>h+=sl(esc(a.name),dh(L,a.code),null,'ind'));if(C.ga)h+=sl('Total gastos generales y administrativos',null,-C.ga,'sub');
 h+=sl(C.uo<0?'Pérdida en operaciones':'Utilidad en operaciones',null,C.uo,'sub');
 if(C.oi||C.gf||C.og){h+=sl('Otros ingresos y gastos',null,null,'sec');
  C.inG('OI').forEach(a=>h+=sl(esc(a.name),-dh(L,a.code),null,'ind'));
  C.inG('GF').concat(C.inG('OG')).forEach(a=>h+=sl(esc(a.name),-dh(L,a.code),null,'ind'));
  h+=sl('Neto otros ingresos (gastos)',null,C.oi-C.gf-C.og,'sub');}
 h+=sl('Utilidad antes del ISR',null,C.uai,'sub');
 if(C.isr)h+=sl('Impuesto sobre la renta',null,-C.isr,'ind');
 h+=sl(C.un<0?'PÉRDIDA NETA DEL PERÍODO':'UTILIDAD NETA DEL PERÍODO',null,C.un,'big');
 return h+'</div>'}

function balanceGeneral(C){const p=period();const {L}=C;let tA=0,tP=0,tK=0;
 let h=`<div class="stmt"><div class="stmt-h"><strong>${esc(S.empresa)}</strong><span>Balance General (Estado de Situación Financiera)</span><span>Al ${p?fdate(p.b):'—'} · Valores en RD$</span></div>`;
 h+=sl('Activos',null,null,'sec');
 for(const g of ['AC','INV','PPE','DIF','OA']){let list=C.inG(g);if(g==='AC'&&C.periodic&&!list.some(a=>a.code==='1004')&&C.invFin)list=list.concat([AMAP['1004']]).sort((a,b)=>a.code.localeCompare(b.code,'es',{numeric:true}));
  if(!list.length)continue;let t=0;h+=`<div class="sl"><span style="font-weight:600">${GROUPS[g][0].replace(/^\d+ · /,'')}</span><span class="a1"></span><span class="a2"></span></div>`;
  list.forEach(a=>{const v=(a.code==='1004'&&C.periodic)?C.invFin:dh(L,a.code);t+=v;h+=sl((a.contra?'Menos: ':'')+esc(a.name)+(a.code==='1004'&&C.periodic?' (final)':''),v,null,'ind')});
  h+=sl('Total '+GROUPS[g][0].replace(/^\d+ · /,'').toLowerCase(),null,t,'sub');tA+=t;}
 h+=sl('TOTAL ACTIVOS',null,tA,'big');
 h+=sl('Pasivos',null,null,'sec');
 for(const g of ['PC','PLP','PD']){const list=C.inG(g);if(!list.length)continue;let t=0;
  list.forEach(a=>{const v=-dh(L,a.code);t+=v;h+=sl(esc(a.name),v,null,'ind')});h+=sl('Total '+GROUPS[g][0].replace(/^\d+ · /,'').toLowerCase(),null,t,'sub');tP+=t;}
 h+=sl('Total pasivos',null,tP,'sub');
 h+=sl('Capital contable',null,null,'sec');
 C.inG('K').forEach(a=>{const v=-dh(L,a.code);tK+=v;h+=sl((a.contra?'Menos: ':'')+esc(a.name),v,null,'ind')});
 if(C.has('7100')&&!zero(dh(L,'7100'))){const v=-dh(L,'7100');tK+=v;h+=sl('Resumen de Ganancias o Pérdidas',v,null,'ind')}
 if(!zero(C.un)){tK+=C.un;h+=sl(C.un<0?'Pérdida neta del período (sin cerrar)':'Utilidad neta del período (sin cerrar)',C.un,null,'ind')}
 h+=sl('Total capital',null,tK,'sub');
 h+=sl('TOTAL PASIVO + CAPITAL',null,tP+tK,'big');
 const ok=zero(tA-tP-tK);
 h+=`<div class="row" style="justify-content:center;margin-top:10px">${ok?'<span class="pill ok">Activo = Pasivo + Capital ✓</span>':`<span class="pill bad">Descuadre de RD$ ${fm(Math.abs(tA-tP-tK))}</span>`}</div>`;
 return h+'</div>'}

function balanza(C){const {L}=C;const codes=Object.keys(L).sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));let td=0,th=0,sd=0,sh=0;
 const rows=codes.map(c=>{const x=L[c],s=r2(x.d-x.h);td+=x.d;th+=x.h;if(s>0)sd+=s;else sh-=s;
  return `<tr><td>${c}</td><td>${esc(accName(c))}</td><td>${fm(x.d)}</td><td>${fm(x.h)}</td><td>${s>0?fm(s):''}</td><td>${s<0?fm(-s):''}</td></tr>`}).join('');
 const ok=zero(td-th)&&zero(sd-sh);const p=period();
 return `<div class="stmt-h"><strong>${esc(S.empresa)}</strong><span>Balanza de Comprobación de Sumas y Saldos</span><span>${p?`Al ${fdate(p.b)}`:''} · Valores en RD$</span></div>
  <div class="scroll"><table class="grid"><thead><tr><th>Código</th><th>Cuenta</th><th>Débitos</th><th>Créditos</th><th>Saldo deudor</th><th>Saldo acreedor</th></tr></thead>
  <tbody>${rows}</tbody><tfoot><tr><td></td><td>Totales</td><td>${fm(td)}</td><td>${fm(th)}</td><td>${fm(sd)}</td><td>${fm(sh)}</td></tr></tfoot></table></div>
  <div class="row" style="justify-content:center">${ok?'<span class="pill ok">La balanza cuadra ✓</span>':'<span class="pill bad">La balanza no cuadra</span>'}</div>`}

function closingEntries(C){const {L}=C;const fecha=(period()||{b:today()}).b;const out=[];
 const mk=(list,conc,extra)=>{const lines=[];let net=0;list.forEach(a=>{const b=dh(L,a.code);if(zero(b))return;if(b>0)lines.push({c:a.code,d:0,h:b});else lines.push({c:a.code,d:-b,h:0});net+=b});
  (extra||[]).forEach(l=>{lines.push(l);net+=l.h-l.d});net=r2(net);if(!lines.length)return 0;
  if(net>0)lines.push({c:'7100',d:net,h:0});else if(net<0)lines.push({c:'7100',d:0,h:-net});
  out.push({id:'e'+(S.seq++),fecha,concepto:conc,lineas:lines});return net};
 mk(ACC.filter(a=>a.cls==='I'),'Cierre: para cerrar las cuentas de ingresos contra Resumen de Ganancias o Pérdidas.');
 const inv=[];if(C.periodic){if(C.invIni>0)inv.push({c:'1004',d:0,h:C.invIni});if(C.invFin>0)inv.push({c:'1004',d:C.invFin,h:0});}
 mk(ACC.filter(a=>a.cls==='CO'||a.cls==='G'),'Cierre: para cerrar costos y gastos, cancelar el inventario inicial y registrar el inventario final.',inv);
 const res=r2(C.un+(-dh(L,'7100')));
 if(!zero(res))out.push({id:'e'+(S.seq++),fecha,concepto:res>0?'Cierre: para trasladar la utilidad del período a Ganancias del Período.':'Cierre: para trasladar la pérdida del período a Ganancias del Período.',
  lineas:res>0?[{c:'7100',d:res,h:0},{c:'3202',d:0,h:res}]:[{c:'3202',d:-res,h:0},{c:'7100',d:0,h:-res}]});
 return out}

function vReportes(){const C=calc();
 let h=`<h2 class="view-title">Balanza y estados</h2><p class="lede">Se calculan solos con los asientos del Diario.</p>
  <div class="seg" role="group" aria-label="Reporte"><button data-a="rep" data-v="bal" aria-pressed="${repTab==='bal'}">Balanza</button><button data-a="rep" data-v="res" aria-pressed="${repTab==='res'}">Resultados</button><button data-a="rep" data-v="bg" aria-pressed="${repTab==='bg'}">Balance general</button></div>`;
 if(!S.entries.length){V().innerHTML=h+`<div class="card empty"><strong>No hay asientos todavía.</strong><span>Los reportes aparecen cuando registres transacciones.</span></div>`;return}
 if(repTab!=='bal'&&C.periodic&&(C.invIni||C.compras))h+=`<div class="card"><label class="f" for="invFin">Inventario final de mercancías (conteo físico, RD$)<input type="text" inputmode="decimal" id="invFin" value="${S.invFinal==null?'':S.invFinal}" placeholder="${fm(C.invIni)}"></label>
  <span style="font-size:.82rem;color:var(--muted)">Sistema periódico: Costo de ventas = Inventario inicial + Compras netas − Inventario final. Si lo dejas vacío se usa ${fm(C.invIni)}.</span></div>`;
 h+=`<div class="card">${repTab==='bal'?balanza(C):repTab==='res'?estadoResultados(C):balanceGeneral(C)}</div>`;
 const temp=ACC.some(a=>['I','CO','G'].includes(a.cls)&&C.has(a.code)&&!zero(dh(C.L,a.code)));
 if(repTab!=='bal'&&temp)h+=`<div class="card"><h3>Asientos de cierre</h3><p style="margin:0;font-size:.88rem;color:var(--muted)">Al final del período se cierran ingresos, costos y gastos contra 7100 Resumen de Ganancias o Pérdidas, y el resultado pasa a 3202 Ganancias del Período.</p>
  <div class="row">${closingAsk?`<span style="font-size:.88rem">Se agregarán los asientos de cierre al Diario. ¿Continuar?</span><button class="btn sm primary" data-a="close-yes">Sí, cerrar período</button><button class="btn sm ghost" data-a="close-no">Cancelar</button>`:`<button class="btn" data-a="close">Generar asientos de cierre</button>`}</div></div>`;
 V().innerHTML=h;
 const inp=document.getElementById('invFin');if(inp)inp.onchange=()=>{S.invFinal=inp.value.trim()===''?null:pnum(inp.value);save();render()};}

function vCatalogo(){const q=catQ.trim().toLowerCase();
 let h=`<h2 class="view-title">Catálogo de cuentas</h2><p class="lede">Basado en el catálogo de UTESA y ampliado. D = naturaleza deudora, C = acreedora. Las cuentas “Menos:” son reguladoras (contra-cuentas).</p>
 <input type="search" id="catQ" placeholder="Buscar por código o nombre" value="${esc(catQ)}" aria-label="Buscar cuenta">`;
 let body='',lastCls='';
 for(const g in GROUPS){const list=ACC.filter(a=>a.g===g&&(!q||a.code.includes(q)||a.name.toLowerCase().includes(q)));if(!list.length)continue;
  const cls=GROUPS[g][1];if(cls!==lastCls){body+=`<div class="cat-cls">${CLASSES[cls]}</div>`;lastCls=cls}
  body+=`<div class="cat-grp">${GROUPS[g][0]}</div>`+list.map(a=>`<div class="cat-item"><span class="num">${a.code}</span><span>${a.contra?'<em style="color:var(--muted)">Menos: </em>':''}${esc(a.name)}${a.custom?' <span class="pill mute">propia</span>':''}</span><span class="nat ${a.nat}">${a.nat}</span></div>`).join('');}
 h+=`<div class="card" id="catList">${body||'<div class="empty">Ninguna cuenta coincide.</div>'}</div>`;
 h+=`<div class="card"><h3>Agregar cuenta propia</h3>
  <div class="ed-meta"><label class="f" for="nCode">Código<input type="text" id="nCode" placeholder="1000-06"></label><label class="f" for="nName">Nombre<input type="text" id="nName" placeholder="Banco Santa Cruz"></label></div>
  <label class="f" for="nGrp">Grupo<select id="nGrp">${Object.entries(GROUPS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></label>
  <label class="row" style="font-size:.88rem" for="nContra"><input type="checkbox" id="nContra"> Es cuenta reguladora (naturaleza contraria a su grupo)</label>
  <div class="msg" id="nMsg"></div><div class="row"><span class="spacer"></span><button class="btn primary" data-a="addacc">Agregar al catálogo</button></div></div>`;
 h+=`<div class="card"><h3>Empresa y datos</h3>
  <label class="f" for="empresa">Nombre de la empresa en los reportes<input type="text" id="empresa" value="${esc(S.empresa)}"></label>
  <p style="margin:0;font-size:.85rem;color:var(--muted)">Tus asientos se guardan en este navegador. Copia el respaldo de vez en cuando y pégalo aquí para recuperarlos en otro teléfono.</p>
  <textarea id="backup" rows="3" aria-label="Respaldo" placeholder="Pega aquí un respaldo para restaurarlo"></textarea>
  <div class="msg" id="bMsg"></div>
  <div class="row"><button class="btn sm" data-a="bk-copy">Copiar respaldo</button><button class="btn sm" data-a="bk-load">Restaurar respaldo pegado</button><span class="spacer"></span>
  ${resetAsk==='seed'?`<button class="btn sm danger" data-a="seed-yes">Sí, restaurar</button><button class="btn sm ghost" data-a="seed-no">No</button>`:`<button class="btn sm ghost danger" data-a="seed">Restaurar datos de ejemplo</button>`}</div></div>`;
 V().innerHTML=h;
 const qi=document.getElementById('catQ');qi.oninput=()=>{catQ=qi.value;const pos=qi.selectionStart;vCatalogo();const n=document.getElementById('catQ');n.focus();n.setSelectionRange(pos,pos)};
 const em=document.getElementById('empresa');em.onchange=()=>{S.empresa=em.value.trim()||'Mi Empresa, SRL';save();render()};}

/* ========== EVENTOS ========== */
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;TAB=b.dataset.tab;confirmDel=null;resetAsk=null;closingAsk=false;render();window.scrollTo(0,0)});
V().addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 const M=(id,t,c)=>{const m=document.getElementById(id);m.className='msg '+(c||'bad');m.textContent=t};
 switch(a){
  case 'new':newOpen=true;editingId=null;render();break;
  case 'edit':editingId=id;newOpen=false;render();break;
  case 'del':confirmDel=id;render();break;
  case 'del-no':confirmDel=null;render();break;
  case 'del-yes':S.entries=S.entries.filter(x=>x.id!==id);confirmDel=null;save();render();break;
  case 'blank':resetAsk='blank';render();break;
  case 'blank-no':case 'seed-no':resetAsk=null;render();break;
  case 'blank-yes':S.entries=[];S.invFinal=null;resetAsk=null;save();render();break;
  case 'seed':resetAsk='seed';render();break;
  case 'seed-yes':{const emp=S.empresa,cu=S.custom;S=seed();S.empresa=emp;S.custom=cu;resetAsk=null;save();buildAcc();render();break}
  case 'ex':exSel=+b.dataset.i;exShow=false;render();window.scrollTo({top:0});break;
  case 'ex-close':exSel=null;render();break;
  case 'rep':repTab=b.dataset.v;closingAsk=false;render();break;
  case 'close':closingAsk=true;render();break;
  case 'close-no':closingAsk=false;render();break;
  case 'close-yes':{const C=calc();S.entries.push(...closingEntries(C));S.invFinal=null;closingAsk=false;sortEntries();save();render();break}
  case 'addacc':{const code=document.getElementById('nCode').value.trim(),name=document.getElementById('nName').value.trim(),g=document.getElementById('nGrp').value,ct=document.getElementById('nContra').checked;
   if(!/^[0-9][0-9-]{2,}$/.test(code))return M('nMsg','Escribe un código numérico, por ejemplo 1000-06.');
   if(AMAP[code])return M('nMsg',`El código ${code} ya existe: ${AMAP[code].name}.`);
   if(!name)return M('nMsg','Escribe el nombre de la cuenta.');
   S.custom.push([code,name,g,ct?1:0]);save();buildAcc();render();break}
  case 'bk-copy':{const txt=JSON.stringify(S),ta=document.getElementById('backup');
   const ok=()=>M('bMsg','Respaldo copiado. Guárdalo en tus notas o envíatelo por WhatsApp.','ok');
   try{navigator.clipboard.writeText(txt).then(ok,()=>{ta.value=txt;ta.select();M('bMsg','No se pudo copiar automáticamente. El respaldo quedó seleccionado en el cuadro: cópialo a mano.')})}catch(err){ta.value=txt;ta.select();M('bMsg','El respaldo quedó en el cuadro: cópialo a mano.')}break}
  case 'bk-load':{try{const o=JSON.parse(document.getElementById('backup').value);if(!Array.isArray(o.entries))throw 0;S=Object.assign(seed(),o);save();buildAcc();render();M('bMsg','Respaldo restaurado.','ok')}catch(err){M('bMsg','Ese texto no es un respaldo válido. Pega el texto completo que copiaste.')}break}
 }});
render();
</script>
